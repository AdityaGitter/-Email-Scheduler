services:
  redis: { image: "redis:7", ports: ["6379:6379"], command: ["redis-server","--appendonly","yes"], volumes: ["redisdata:/data"] }
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: scheduler }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    ports: ["9200:9200"]
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
volumes: { redisdata: {}, pgdata: {} }
